server {
    listen 80;
    root /usr/share/nginx/html;

    # Seguridad (docs/seguridad-portal.md, A02): no mostrar la versión y enviar cabeceras básicas.
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # DNS interno de Docker: se re-resuelve "api" si el contenedor se reinicia.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8000;

    # Seguridad (A01): las rutas de administración de la demo no se exponen desde el portal.
    # En la demo se usan directo en http://localhost:8000/docs, sin pasar por aquí.
    location /api/admin/ {
        return 403;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
    }

    location / {
        try_files $uri /index.html;
    }
}
