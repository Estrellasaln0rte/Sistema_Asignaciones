server {
    listen 80;
    root /usr/share/nginx/html;

    # DNS interno de Docker: se re-resuelve "api" si el contenedor se reinicia.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
    }

    location / {
        try_files $uri /index.html;
    }
}
