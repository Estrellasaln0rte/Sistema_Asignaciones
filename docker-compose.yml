# Sistema de Asignaciones: entorno de desarrollo
# Levanta todo con: docker compose up -d --build

services:
  # ---------- Aplicación ----------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: asignaciones
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d asignaciones"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:-app}@postgres:5432/asignaciones
      POOL_SIZE: ${POOL_SIZE:-10}
      POOL_TIMEOUT_S: ${POOL_TIMEOUT_S:-5}
      MODO_ATOMICO: ${MODO_ATOMICO:-false}
      OTEL_SERVICE_NAME: api-asignaciones
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  portal:
    build: ./portal
    ports:
      - "5173:80"
    depends_on:
      - api

  # ---------- Observabilidad ----------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://app:${POSTGRES_PASSWORD:-app}@postgres:5432/asignaciones?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo.yaml:/etc/tempo.yaml:ro

  loki:
    image: grafana/loki:3.2.0
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./infra/loki.yaml:/etc/loki/config.yaml:ro
    ports:
      - "3100:3100"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    # Si no existe infra/alertmanager/discord_webhook se usa el de ejemplo:
    # Alertmanager arranca igual y las alertas solo se ven en http://localhost:9093
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        cp /etc/alertmanager/discord_webhook /tmp/discord_webhook 2>/dev/null
        || cp /etc/alertmanager/discord_webhook.example /tmp/discord_webhook;
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager
    volumes:
      - ./infra/alertmanager:/etc/alertmanager:ro
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

  # ---------- Inyector de tráfico (se corre bajo demanda) ----------
  k6:
    image: grafana/k6:0.54.0
    profiles: ["carga"]
    volumes:
      - ./load-tests:/scripts:ro
    environment:
      API_URL: http://api:8000
    command: ["run", "/scripts/avalancha.js"]
    depends_on:
      - api

volumes:
  pgdata:
